[package]
name = "daylight"
version = "1.1.0"
edition = "2021"
rust-version = "1.74"
description = "Terminal day/night world clock: Kavrayskiy VII map, real-time terminator, braille rendering"
license = "AGPL-3.0-or-later"

[[bin]]
name = "daylight"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
signal-hook = "0.4"

[dev-dependencies]
serde_json = "1"
portable-pty = "0.8"

[profile.release]
lto = true
