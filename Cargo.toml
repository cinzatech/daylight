[package]
name = "daylight"
version = "0.1.0"
edition = "2021"
description = "Terminal day/night world clock: Kavrayskiy VII map, real-time terminator, braille rendering"

[[bin]]
name = "daylight"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
signal-hook = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"

[profile.release]
lto = true
